services:
  - type: web
    name: lelouch-pix
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_MODE
        value: "0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/picks.db
      - key: GROUP_TZ
        value: America/Chicago
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # Slip screenshots in Discord (xAI vision). Leave unset to keep the feature off.
      - key: XAI_API_KEY
        sync: false
      # Optional: comma-separated channel IDs to read screenshots in (blank = any channel the bot can see).
      - key: DISCORD_SLIP_CHANNEL_IDS
        sync: false
      # Optional: staff channel IDs; screenshots confirmed there are test slips (kept out of standings).
      - key: DISCORD_STAFF_CHANNEL_IDS
        sync: false
