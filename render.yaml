services:
  - type: web
    name: lelouch-pix
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_MODE
        value: "0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/picks.db
      - key: GROUP_TZ
        value: America/Chicago
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
