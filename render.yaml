services:
  - type: web
    name: lelouch-pix
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_MODE
        value: "0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/picks.db
      - key: GROUP_TZ
        value: America/Chicago
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # Slip screenshots in Discord (xAI vision). Leave unset to keep the feature off.
      - key: XAI_API_KEY
        sync: false
      # Optional: comma-separated channel IDs to read screenshots in (blank = any channel the bot can see).
      - key: DISCORD_SLIP_CHANNEL_IDS
        sync: false
      # Optional: staff channel IDs; screenshots confirmed there are test slips (kept out of standings).
      - key: DISCORD_STAFF_CHANNEL_IDS
        sync: false
      # Graded-result channel. Blank = look up a channel named layup-feed.
      - key: LAYUP_FEED_CHANNEL_ID
        sync: false
      # Edge Engine login. Both must be set or /edge stays off. Never commit the values.
      - key: EDGE_EMAIL
        sync: false
      - key: EDGE_PASSWORD
        sync: false
      # Comma-separated channel IDs. Screenshots there are rated and are not added to the board.
      - key: EDGE_CHANNEL_IDS
        sync: false
      # Minutes to keep the Edge board in memory. Default 12 (refresh every 10–15 min).
      - key: EDGE_CACHE_TTL_MIN
        value: "12"
